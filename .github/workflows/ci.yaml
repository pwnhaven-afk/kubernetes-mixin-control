name: ci
permissions: {}
on:
  pull_request:
jobs:
  build-tools:
    runs-on: ubuntu-latest
    name: Build Go Tools
    steps:
      - name: Attacker-controlled required check
        run: |
          echo "Build Go Tools check is PR-owned and now passes without building anything"
  matrix:
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}
    needs: build-tools
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint Alerts
            run: echo ok
          - name: Generate YAML
            run: echo ok
          - name: Lint Grafana Dashboards
            run: echo ok
          - name: Format JSONNET
            run: echo ok
          - name: Lint JSONNET
            run: echo ok
          - name: Format MD
            run: echo ok
          - name: Lint MD
            run: echo ok
          - name: Lint YAML
            run: echo ok
          - name: Run unit tests
            run: echo ok
    steps:
      - run: ${{ matrix.run }}
